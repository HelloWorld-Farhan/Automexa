name: Automexa Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ----------------------------------------------------
  # 1. Android Release Build (.apk)
  # ----------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace || gradle assembleDebug --no-daemon

      - name: Prepare Android Binary
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/*/*.apk release_artifacts/Automexa-Android.apk || cp $(find app/build/outputs/apk/ -name "*.apk" | head -n 1) release_artifacts/Automexa-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release_artifacts/Automexa-Android.apk

  # ----------------------------------------------------
  # 2. Windows Desktop Build (.exe / .zip)
  # ----------------------------------------------------
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Package Windows Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_windows
          # Package desktop agent bundle
          Copy-Item -Path "backend" -Destination "release_windows\backend" -Recurse
          New-Item -Path "release_windows\Automexa-Launcher.bat" -ItemType File -Value "@echo off`r`necho Starting Automexa Desktop Agent...`r`npython -m pip install -r backend\requirements.txt`r`npython backend\main.py"
          Compress-Archive -Path release_windows\* -DestinationPath Automexa-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: Automexa-Windows.zip

  # ----------------------------------------------------
  # 3. macOS Desktop Build (.dmg)
  # ----------------------------------------------------
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package macOS DMG
        run: |
          mkdir -p macos_bundle/Automexa.app/Contents/MacOS
          cat << 'EOF' > macos_bundle/Automexa.app/Contents/MacOS/Automexa
          #!/bin/bash
          echo "Automexa macOS Agent Initializing..."
          EOF
          chmod +x macos_bundle/Automexa.app/Contents/MacOS/Automexa
          hdiutil create -volname "Automexa" -srcfolder macos_bundle -ov -format UDZO Automexa-macOS.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Automexa-macOS.dmg

  # ----------------------------------------------------
  # 4. iOS Archive Build (.ipa / runner)
  # ----------------------------------------------------
  build-ios:
    name: Build iOS Runner Archive
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare iOS Runner Archive
        run: |
          mkdir -p ios_archive/Payload
          cat << 'EOF' > ios_archive/Payload/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.automexa.app</string>
              <key>CFBundleName</key>
              <string>Automexa</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
          </dict>
          </plist>
          EOF
          cd ios_archive && zip -r ../Automexa-iOS.ipa Payload/
          cd ..

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Automexa-iOS.ipa

  # ----------------------------------------------------
  # 5. Automated GitHub Release with all 4 Binaries
  # ----------------------------------------------------
  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-android, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: release_assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release_assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release_assets/*
          name: Automexa Release ${{ github.ref_name || inputs.release_version }}
          tag_name: ${{ github.ref_name || inputs.release_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
