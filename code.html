<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Smart Home Dashboard</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Phosphor Icons CDN for clean iOS-style outline icons -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#e6e4dc',
            cardBg: '#fefefe',
            accentDark: '#1c1b20',
            pillInactive: '#edece6',
            greenSwitch: '#a3d993',
            sceneBlue: '#c7d6df',
            scenePurple: '#d4cfea',
            sceneTeal: '#bad8dc',
            scenePink: '#e8cbcf',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'sans-serif'],
          },
          borderRadius: {
            '3xl': '1.75rem',
            '4xl': '2.25rem',
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Device Frame & Layout Details -->
<style data-purpose="mobile-mockup-layout">
    body {
      background-color: #2b2b2d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* iPhone Frame Shell */
    .iphone-shell {
      position: relative;
      width: 375px;
      height: 812px;
      background-color: #e6e4dc;
      border: 10px solid #000000;
      border-radius: 54px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
    }

    /* Hide standard scrollbars for a native mobile look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="p-4 sm:p-8">
<!-- iPhone Outer Shell Simulation -->
<div class="iphone-shell" data-purpose="ios-device-container">
<!-- BEGIN: StatusBar -->
<!-- iOS Status Bar with Time and Dynamic Island -->
<header class="w-full pt-3 pb-1 px-7 flex justify-between items-center z-30 select-none" data-purpose="status-bar">
<!-- Current Time -->
<span class="text-sm font-semibold tracking-tight text-neutral-900 pl-1">9:41</span>
<!-- Dynamic Island Cutout -->
<div class="w-24 h-[22px] bg-black rounded-full flex items-center justify-end pr-2.5 space-x-1.5 -ml-1">
<div class="w-2.5 h-2.5 rounded-full bg-[#111124]/80 border border-neutral-800"></div>
</div>
<!-- Signal, WiFi & Battery Status Indicators -->
<div class="flex items-center space-x-1.5 text-neutral-900 pr-0.5">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 18 12">
<rect height="3.5" rx="0.75" width="2.5" x="0" y="8.5"></rect>
<rect height="6" rx="0.75" width="2.5" x="4" y="6"></rect>
<rect height="8.5" rx="0.75" width="2.5" x="8" y="3.5"></rect>
<rect height="11.5" rx="0.75" width="2.5" x="12" y="0.5"></rect>
</svg>
<!-- WiFi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.5a10.9 10.9 0 0 1 6.8 2.4.8.8 0 0 1 .1 1.1l-1 1.2a.8.8 0 0 1-1.1.1 7.4 7.4 0 0 0-9.6 0 .8.8 0 0 1-1.1-.1l-1-1.2a.8.8 0 0 1 .1-1.1A10.9 10.9 0 0 1 8 2.5zm0 4.2a6.4 6.4 0 0 1 3.9 1.4.7.7 0 0 1 .1 1l-1 1.1a.7.7 0 0 1-1 .1 3.5 3.5 0 0 0-4 0 .7.7 0 0 1-1-.1l-1-1.1a.7.7 0 0 1 .1-1 6.4 6.4 0 0 1 3.9-1.4zm0 4.2a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border-[1.2px] border-neutral-900 rounded-[3.5px] p-[1.5px] flex items-center">
<div class="h-full w-3 bg-neutral-900 rounded-[1.5px]"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 overflow-y-auto no-scrollbar px-5 pt-3 pb-24" data-purpose="scrollable-dashboard">
<!-- Greeting Title -->
<h1 class="text-[34px] font-normal tracking-tight text-[#222126] mb-5 pl-1 leading-tight">
        Morning, Anna!
      </h1>
<!-- Top Section: Climate Info & Scene Buttons Grid -->
<section class="grid grid-cols-2 gap-3 mb-6" data-purpose="overview-summary">
<!-- Room Temperature Big Card -->
<div class="bg-cardBg rounded-3xl p-4 flex flex-col justify-between shadow-[0_2px_8px_rgba(0,0,0,0.03)] h-[178px]">
<div>
<p class="text-[17px] text-[#2c2b30] leading-[1.2] font-normal">
              Room<br/>temperature
            </p>
<p class="text-[26px] font-normal text-[#1d1c21] mt-2">
              24 °C
            </p>
</div>
<p class="text-xs text-[#6e6d72] font-normal">
            Monday, April 8
          </p>
</div>
<!-- 2x2 Quick Action Scenes Grid -->
<div class="grid grid-cols-2 gap-2.5 h-[178px]" data-purpose="scenes-grid">
<!-- Wake Up Scene -->
<button class="bg-sceneBlue rounded-2xl flex flex-col items-center justify-center p-2.5 transition active:scale-95 text-[#2a3036]">
<i class="ph ph-sun text-2xl mb-1"></i>
<span class="text-[11px] font-medium tracking-tight">Wake up</span>
</button>
<!-- Sleep Scene -->
<button class="bg-scenePurple rounded-2xl flex flex-col items-center justify-center p-2.5 transition active:scale-95 text-[#30283c]">
<!-- Closed eye / sleep icon representation -->
<svg class="w-6 h-6 stroke-current fill-none mb-1 stroke-2" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M3 10a12 12 0 0 0 18 0"></path>
<line x1="6" x2="4" y1="12" y2="15"></line>
<line x1="12" x2="12" y1="13" y2="17"></line>
<line x1="18" x2="20" y1="12" y2="15"></line>
</svg>
<span class="text-[11px] font-medium tracking-tight">Sleep</span>
</button>
<!-- Cleaning Scene -->
<button class="bg-sceneTeal rounded-2xl flex flex-col items-center justify-center p-2.5 transition active:scale-95 text-[#243538]">
<i class="ph ph-washing-machine text-2xl mb-1"></i>
<span class="text-[11px] font-medium tracking-tight">Cleaning</span>
</button>
<!-- Breakfast Scene -->
<button class="bg-scenePink rounded-2xl flex flex-col items-center justify-center p-2.5 transition active:scale-95 text-[#3f2b2e]">
<i class="ph ph-coffee text-2xl mb-1"></i>
<span class="text-[11px] font-medium tracking-tight">Breakfast</span>
</button>
</div>
</section>
<!-- BEGIN: RoomsCategoryFilter -->
<!-- Horizontally Scrollable Room Category Tabs -->
<nav class="flex items-center space-x-2 overflow-x-auto no-scrollbar pb-1 mb-5" data-purpose="room-filters">
<!-- Active Tab: All rooms -->
<button class="px-4 py-2 bg-[#201f25] text-white text-[13px] font-medium rounded-full shrink-0 shadow-sm">
          All rooms
        </button>
<!-- Inactive Tab: Kitchen -->
<button class="px-4 py-2 bg-[#dfded7] hover:bg-[#d6d5ce] text-[#3c3a40] text-[13px] font-medium rounded-full shrink-0">
          Kitchen
        </button>
<!-- Inactive Tab: Bedroom -->
<button class="px-4 py-2 bg-[#dfded7] hover:bg-[#d6d5ce] text-[#3c3a40] text-[13px] font-medium rounded-full shrink-0">
          Bedroom
        </button>
<!-- Inactive Tab: Living room -->
<button class="px-4 py-2 bg-[#dfded7] hover:bg-[#d6d5ce] text-[#3c3a40] text-[13px] font-medium rounded-full shrink-0">
          Living room
        </button>
</nav>
<!-- END: RoomsCategoryFilter -->
<!-- BEGIN: DeviceGrid -->
<!-- Two-Column Grid of Smart Devices -->
<section class="grid grid-cols-2 gap-3" data-purpose="devices-list">
<!-- Device Card 1: Kettle -->
<div class="bg-cardBg rounded-3xl p-3.5 relative flex flex-col justify-between h-[180px] shadow-[0_2px_8px_rgba(0,0,0,0.03)] overflow-hidden">
<div class="z-10">
<h2 class="text-[17px] font-normal text-[#1a191f] leading-tight">Kettle</h2>
<div class="inline-block mt-1 px-1.5 py-0.5 bg-[#ecebe5] rounded text-[9.5px] font-normal text-[#59575e]">
              to launch 00:05:11
            </div>
</div>
<!-- Kettle Graphic / Image -->
<div class="absolute right-0 bottom-0 w-28 h-28 pointer-events-none flex items-end justify-end">
<!-- Stylized minimalist white kettle -->
<svg class="w-full h-full object-contain" viewbox="0 0 120 120">
<defs>
<lineargradient id="metalTop" x1="0" x2="1" y1="0" y2="0">
<stop offset="0%" stop-color="#cfd2d6"></stop>
<stop offset="50%" stop-color="#ffffff"></stop>
<stop offset="100%" stop-color="#a4a8ad"></stop>
</lineargradient>
<lineargradient id="kettleBody" x1="0" x2="1" y1="0" y2="0">
<stop offset="0%" stop-color="#f8f9fa"></stop>
<stop offset="70%" stop-color="#e9ecef"></stop>
<stop offset="100%" stop-color="#dee2e6"></stop>
</lineargradient>
</defs>
<!-- Handle -->
<path d="M85 38 H96 C102 38 102 85 96 85 H85" fill="none" stroke="#f1f3f5" stroke-linecap="round" stroke-width="8"></path>
<!-- Spout Lip -->
<path d="M30 42 L25 46 L30 52 Z" fill="#e9ecef"></path>
<!-- Kettle Body -->
<path d="M35 38 L40 102 C40 106 80 106 80 102 L85 38 Z" fill="url(#kettleBody)"></path>
<!-- Metallic Rim / Lid -->
<ellipse cx="60" cy="38" fill="url(#metalTop)" rx="25" ry="6"></ellipse>
<rect fill="#adb5bd" height="4" rx="2" width="10" x="55" y="30"></rect>
</svg>
</div>
<!-- Power Button Toggle -->
<button class="w-8 h-8 rounded-lg bg-greenSwitch flex items-center justify-center text-[#1d3514] z-10 active:scale-90 transition">
<i class="ph ph-power text-base font-bold"></i>
</button>
</div>
<!-- Device Card 2: Coffee Machine -->
<div class="bg-cardBg rounded-3xl p-3.5 relative flex flex-col justify-between h-[180px] shadow-[0_2px_8px_rgba(0,0,0,0.03)] overflow-hidden">
<div class="z-10">
<h2 class="text-[17px] font-normal text-[#1a191f] leading-tight">
              Coffee<br/>Machine
            </h2>
</div>
<!-- Coffee Machine Graphic / Image -->
<div class="absolute right-0 bottom-0 w-28 h-28 pointer-events-none flex items-end justify-end">
<!-- Stylized Espresso Machine -->
<svg class="w-full h-full object-contain" viewbox="0 0 120 120">
<defs>
<lineargradient id="espressoMetal" x1="0" x2="1" y1="0" y2="0">
<stop offset="0%" stop-color="#495057"></stop>
<stop offset="50%" stop-color="#adb5bd"></stop>
<stop offset="100%" stop-color="#212529"></stop>
</lineargradient>
</defs>
<!-- Machine Main Black Body -->
<rect fill="#1b1c1e" height="82" rx="4" width="46" x="52" y="24"></rect>
<!-- Chrome Top -->
<rect fill="url(#espressoMetal)" height="6" rx="2" width="54" x="48" y="20"></rect>
<!-- Group Head & Handle -->
<rect fill="#343a40" height="12" rx="1" width="24" x="56" y="52"></rect>
<!-- Portafilter handle extending left -->
<rect fill="#111113" height="6" rx="3" width="38" x="22" y="60"></rect>
<!-- Cup Tray & Base -->
<rect fill="url(#espressoMetal)" height="10" rx="2" width="50" x="50" y="96"></rect>
</svg>
</div>
<!-- Power Button Toggle -->
<button class="w-8 h-8 rounded-lg bg-greenSwitch flex items-center justify-center text-[#1d3514] z-10 active:scale-90 transition">
<i class="ph ph-power text-base font-bold"></i>
</button>
</div>
<!-- Device Card 3: Homepod -->
<div class="bg-cardBg rounded-3xl p-3.5 relative flex flex-col justify-between h-[180px] shadow-[0_2px_8px_rgba(0,0,0,0.03)] overflow-hidden">
<div class="z-10">
<h2 class="text-[17px] font-normal text-[#1a191f] leading-tight">Homepod</h2>
<div class="inline-block mt-1 px-1.5 py-0.5 bg-[#ecebe5] rounded text-[9.5px] font-normal text-[#59575e]">
              to launch 03:08:09
            </div>
</div>
<!-- Homepod Graphic / Image -->
<div class="absolute right-0 bottom-0 w-28 h-24 pointer-events-none flex items-end justify-end">
<svg class="w-full h-full object-contain" viewbox="0 0 100 100">
<!-- Mesh smart speaker body -->
<defs>
<lineargradient id="meshGrad" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#ffffff"></stop>
<stop offset="100%" stop-color="#d0d5dd"></stop>
</lineargradient>
</defs>
<path d="M30 95 C30 50 40 40 70 40 C95 40 100 60 100 95 Z" fill="url(#meshGrad)"></path>
<!-- Top touch disk -->
<ellipse cx="68" cy="46" fill="#a0a4a8" rx="22" ry="10"></ellipse>
<ellipse cx="68" cy="46" fill="#6c757d" rx="16" ry="7"></ellipse>
</svg>
</div>
<!-- Power Button Toggle -->
<button class="w-8 h-8 rounded-lg bg-greenSwitch flex items-center justify-center text-[#1d3514] z-10 active:scale-90 transition">
<i class="ph ph-power text-base font-bold"></i>
</button>
</div>
<!-- Device Card 4: Vacuum Cleaner -->
<div class="bg-cardBg rounded-3xl p-3.5 relative flex flex-col justify-between h-[180px] shadow-[0_2px_8px_rgba(0,0,0,0.03)] overflow-hidden">
<div class="z-10">
<h2 class="text-[17px] font-normal text-[#1a191f] leading-tight">
              Vacuum<br/>Cleaner
            </h2>
</div>
<!-- Vacuum Cleaner Graphic / Image -->
<div class="absolute -right-2 -bottom-2 w-32 h-32 pointer-events-none flex items-end justify-end">
<!-- Modern Robot Vacuum Disk -->
<svg class="w-full h-full object-contain" viewbox="0 0 120 120">
<defs>
<lineargradient id="vacuumBody" x1="0" x2="1" y1="0" y2="1">
<stop offset="0%" stop-color="#ffffff"></stop>
<stop offset="80%" stop-color="#dce1e6"></stop>
<stop offset="100%" stop-color="#c5cbd2"></stop>
</lineargradient>
</defs>
<!-- Disc Body -->
<ellipse cx="85" cy="85" fill="url(#vacuumBody)" rx="46" ry="34" stroke="#92d5df" stroke-width="1.5"></ellipse>
<!-- Laser / Sensor Turret -->
<ellipse cx="80" cy="80" fill="#ced4da" rx="14" ry="10" stroke="#ffffff" stroke-width="1"></ellipse>
<!-- Indicator Light -->
<circle cx="68" cy="74" fill="#5bc0be" r="2"></circle>
</svg>
</div>
<!-- Power Button Toggle -->
<button class="w-8 h-8 rounded-lg bg-greenSwitch flex items-center justify-center text-[#1d3514] z-10 active:scale-90 transition">
<i class="ph ph-power text-base font-bold"></i>
</button>
</div>
</section>
<!-- END: DeviceGrid -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomNavigation -->
<!-- Frosted Glass Style Floating Nav Bar -->
<footer class="absolute bottom-5 inset-x-4 bg-white/70 backdrop-blur-xl rounded-full px-3 py-2 flex items-center justify-between border border-white/40 shadow-[0_8px_30px_rgb(0,0,0,0.08)] z-30" data-purpose="bottom-navigation-bar">
<!-- Active Home Item -->
<button class="flex items-center space-x-1.5 bg-[#bdd1d9] text-[#1e282c] px-4 py-2 rounded-full font-medium text-xs transition">
<i class="ph ph-house text-lg font-bold"></i>
<span>Home</span>
</button>
<!-- Scenes / Automations -->
<button aria-label="Controls" class="p-2.5 text-[#302e35] hover:text-black transition active:scale-90">
<i class="ph ph-sliders text-[22px]"></i>
</button>
<!-- Profile / User Mood -->
<button aria-label="Profile" class="p-2.5 text-[#302e35] hover:text-black transition active:scale-90">
<i class="ph ph-smiley text-[22px]"></i>
</button>
<!-- Settings -->
<button aria-label="Settings" class="p-2.5 text-[#302e35] hover:text-black transition active:scale-90">
<i class="ph ph-gear text-[22px]"></i>
</button>
</footer>
<!-- END: BottomNavigation -->
<!-- iOS Home Indicator -->
<div class="absolute bottom-1 inset-x-0 flex justify-center z-40 pointer-events-none">
<div class="w-32 h-1 bg-black/80 rounded-full"></div>
</div>
</div>
</body></html>
